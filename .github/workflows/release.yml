name: release
on:
  push:
    tags: ["v*"]
jobs:
  verify:
    runs-on: windows-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go.mod, cache: true }
      - name: Formatting
        shell: pwsh
        run: if ((gofmt -l .).Length -ne 0) { gofmt -l .; exit 1 }
      - run: go mod verify
      - run: go vet ./...
      - run: go test ./...
      - name: Package Windows release
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/cronova_windows_amd64.zip
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { name: windows-release, path: dist }
      - name: Generate checksum
        shell: bash
        run: sha256sum dist/cronova_windows_amd64.zip > dist/SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            dist/cronova_windows_amd64.zip
            dist/SHA256SUMS
