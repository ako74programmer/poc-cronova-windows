# Windows-only product: every job runs on Windows.
name: test
on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        shell: pwsh
        run: if ((gofmt -l .).Length -ne 0) { gofmt -l .; exit 1 }
      - name: verify modules
        run: go mod verify
      - name: AI wiki knowledge base is fresh and clean
        shell: pwsh
        run: |
          python internal/ai-wiki/build_knowledge_base.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git diff --exit-code -- internal/aiwiki/knowledge-base.json
          if ($LASTEXITCODE -ne 0) { Write-Error 'knowledge-base.json is stale: run scripts/build-ai-wiki.ps1 and commit'; exit 1 }
      - name: go vet
        run: go vet ./...
      - name: Go tests
        run: go test ./...
      - name: Windows binaries
        run: |
          $env:CGO_ENABLED = "0"
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -o dist/cronova.exe ./cmd/cronova
          go build -trimpath -o dist/cronova-executor.exe ./cmd/cronova-executor
  windows-analysis:
    # Postgres store, race detector and vulnerability scan — still Windows only.
    runs-on: windows-latest
    env:
      CRONOVA_TEST_PG_DSN: postgres://postgres:root@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go.mod, cache: true }
      - name: start preinstalled PostgreSQL
        shell: pwsh
        run: |
          $svc = Get-Service -Name 'postgresql*' | Select-Object -First 1
          Set-Service -Name $svc.Name -StartupType Manual
          Start-Service -Name $svc.Name
          & "$env:PGBIN\psql.exe" -U postgres -c "ALTER USER postgres PASSWORD 'root';"
      - name: Go tests with race detector
        run: go test -race ./...
      - name: Postgres store
        run: go test -v -count=1 ./internal/store/postgres/
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...