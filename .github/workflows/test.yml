# Cross-platform validation with Windows as the product gate.
name: test
on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        shell: pwsh
        run: if ((gofmt -l .).Length -ne 0) { gofmt -l .; exit 1 }
      - name: verify modules
        run: go mod verify
      - name: go vet
        run: go vet ./...
      - name: Go tests
        run: go test ./...
      - name: Windows binaries
        run: |
          $env:CGO_ENABLED = "0"
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -o dist/cronova.exe ./cmd/cronova
          go build -trimpath -o dist/cronova-executor.exe ./cmd/cronova-executor
  linux-analysis:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: cronova_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      CRONOVA_TEST_PG_DSN: postgres://postgres:ci@127.0.0.1:5432/cronova_test?sslmode=disable
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go.mod, cache: true }
      - run: test -z "$(gofmt -l .)"
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test -v -count=1 ./internal/store/postgres/
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
