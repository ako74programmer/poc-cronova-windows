schema_version: 1

project:
  id: item-service
  kind: springboot
  directory: backend
  artifact_directory: target
  artifact_name: item-service.jar

runtime:
  java_version: "21"
  spring_boot_version: "3.5.5"
  build_tool: maven-wrapper
  maven_wrapper: ./mvnw.cmd

springboot:
  group_id: com.example.items
  artifact_id: item-service
  package_name: com.example.items
  profile_test: test
  profile_e2e: e2e

api:
  openapi_file: contracts/openapi.yaml
  base_path: /api
  health_path: /actuator/health

quality:
  compile: true
  unit_tests: true
  integration_tests: true
  openapi_validation: true

server:
  host: 127.0.0.1
  port: 18080
  startup_timeout_seconds: 90
  shutdown_timeout_seconds: 30

artifacts:
  directory: artifacts/springboot
  manifest: backend-manifest.json

ai:
  enabled: false
  max_iterations: 3
  max_changed_files: 30
  provider_id: default
  model: ""
