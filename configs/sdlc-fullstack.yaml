schema_version: 1

stack:
  id: item-platform
  angular_config: configs/sdlc-angular.yaml
  springboot_config: configs/sdlc-springboot.yaml
  openapi_file: contracts/openapi.yaml

artifacts:
  directory: artifacts/fullstack
  frontend_manifest: artifacts/angular/frontend-manifest.json
  frontend_dist: artifacts/angular/dist/browser
  backend_manifest: artifacts/springboot/backend-manifest.json
  backend_jar: artifacts/springboot/package/item-service.jar

services:
  backend_host: 127.0.0.1
  backend_port: 18080
  backend_health_url: http://127.0.0.1:18080/actuator/health
  backend_profile: e2e
  frontend_host: 127.0.0.1
  frontend_port: 4300
  frontend_url: http://127.0.0.1:4300
  startup_timeout_seconds: 90

playwright:
  directory: e2e/playwright
  browser: chromium
  base_url: http://127.0.0.1:4300
  api_url: http://127.0.0.1:18080/api
  workers: 1
  retries: 1
  trace: retain-on-failure
  screenshot: only-on-failure
  video: retain-on-failure
