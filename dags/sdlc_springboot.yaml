dag_id: sdlc_springboot
schedule: "0 2 * * *"        # nightly build; remove for manual-only
start_date: "2026-09-01"
catchup: false
max_active_runs: 1
default_retries: 0

# Composable AI-SDLC pipeline. The DAG uses reusable internal/scripts directly:
# scaffold -> compile -> add CRUD -> review/fix loop -> tests.
tasks:
  - id: scaffold
    type: shell
    timeout: 120
    command: bash internal/scripts/copy-template-to-workspace -t springboot-simple -w workspaces/springboot -p app -c

  - id: compile_skeleton
    type: shell
    timeout: 300
    deps: [scaffold]
    command: bash internal/scripts/compile-project -w workspaces/springboot -p app

  - id: ai_add_crud
    type: shell
    timeout: 300
    deps: [compile_skeleton]
    command: bash internal/scripts/ai-generate-crud -w workspaces/springboot -p app -k com.example.demo -r default -y python

  - id: compile_loop
    type: shell
    timeout: 900
    deps: [ai_add_crud]
    command: bash internal/scripts/ai-review-fix-loop -w workspaces/springboot -p app -k com.example.demo -r default -y python

  - id: tests
    type: shell
    timeout: 300
    deps: [compile_loop]
    command: bash internal/scripts/run-tests -w workspaces/springboot -p app
