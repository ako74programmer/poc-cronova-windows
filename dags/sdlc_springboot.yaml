dag_id: sdlc_springboot
schedule: "0 2 * * *"        # nightly build; remove for manual-only
start_date: "2026-09-01"
catchup: false
max_active_runs: 1
default_retries: 0

# Composable AI-SDLC pipeline. The DAG uses reusable internal/scripts directly:
# scaffold -> compile -> add CRUD -> review/fix loop -> tests.
tasks:
  - id: scaffold
    type: powershell
    timeout: 120
    command: "& .\\internal\\scripts\\copy-template-to-workspace.ps1 -t springboot-simple -w workspaces/springboot -p app -c"

  - id: compile_skeleton
    type: powershell
    timeout: 300
    deps: [scaffold]
    command: "& .\\internal\\scripts\\compile-project.ps1 -w workspaces/springboot -p app"

  - id: ai_add_crud
    type: powershell
    timeout: 300
    deps: [compile_skeleton]
    command: "& .\\internal\\scripts\\ai-generate-crud.ps1 -w workspaces/springboot -p app -k com.example.demo -r default -y python"

  - id: compile_loop
    type: powershell
    timeout: 900
    deps: [ai_add_crud]
    command: "& .\\internal\\scripts\\ai-review-fix-loop.ps1 -w workspaces/springboot -p app -k com.example.demo -r default -y python"

  - id: tests
    type: powershell
    timeout: 300
    deps: [compile_loop]
    command: "& .\\internal\\scripts\\run-tests.ps1 -w workspaces/springboot -p app"
