dag_id: sdlc_maven_luhn
schedule: "0 2 * * *"        # nightly build; remove for manual-only
start_date: "2026-09-01"
catchup: false
max_active_runs: 1
default_retries: 0

# Composable Maven + AI feature pipeline:
# scaffold -> compile -> add feature -> review/fix loop -> tests.
tasks:
  - id: scaffold
    type: shell
    timeout: 300
    command: bash internal/scripts/generate-maven-archetype -a maven-archetype-quickstart -g com.example -r luhn -k com.example.luhn -j 21 -w workspaces/sdlc_maven_luhn -p app -C

  - id: compile_skeleton
    type: shell
    timeout: 600
    deps: [scaffold]
    command: bash internal/scripts/compile-project -w workspaces/sdlc_maven_luhn -p app

  - id: ai_add_feature
    type: shell
    timeout: 300
    deps: [compile_skeleton]
    command: bash internal/scripts/ai-generate-feature -f prompts/luhn.txt -w workspaces/sdlc_maven_luhn -p app -k com.example.luhn -r default -y python

  - id: compile_loop
    type: shell
    timeout: 900
    deps: [ai_add_feature]
    command: bash internal/scripts/ai-review-fix-loop -w workspaces/sdlc_maven_luhn -p app -k com.example.luhn -m kimi-k2.7-code -y python

  - id: tests
    type: shell
    timeout: 300
    deps: [compile_loop]
    command: bash internal/scripts/run-tests -w workspaces/sdlc_maven_luhn -p app
