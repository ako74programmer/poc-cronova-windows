dag_id: sdlc_maven_luhn
schedule: 0 2 * * *
start_date: "2026-09-01"
catchup: false
max_active_runs: 1
tasks:
    - id: generate_maven_archetype
      type: powershell
      command: '& .\internal\scripts\generate-maven-archetype.ps1 -a maven-archetype-quickstart -g com.example -r luhn -k com.example.luhn -j 21 -w workspaces/sdlc_maven_luhn -p app -C'
    - id: maven_compile
      type: powershell
      command: '& .\internal\scripts\maven-compile.ps1 -w workspaces/sdlc_maven_luhn -p app'
      deps:
        - generate_maven_archetype
    - id: ai_generate_java_maven_feature
      type: powershell
      command: '& .\internal\scripts\ai-java-mvn-generate-feature.ps1 -f prompts/luhn.txt -w workspaces/sdlc_maven_luhn -p app -k com.example.luhn -r default -m gpt-5.3-codex -y python'
      deps:
        - maven_compile
    - id: java_maven_compile_fix_loop
      type: powershell
      command: '& .\internal\scripts\java-maven-compile-fix-loop.ps1 -LoopWorkspace workspaces/sdlc_maven_luhn -LoopProject app -LoopPackage com.example.luhn -LoopProvider default -LoopModel gpt-5.3-codex -LoopPython python'
      deps:
        - ai_generate_java_maven_feature
    - id: maven_test
      type: powershell
      command: '& .\internal\scripts\maven-test.ps1 -w workspaces/sdlc_maven_luhn -p app'
      deps:
        - java_maven_compile_fix_loop
