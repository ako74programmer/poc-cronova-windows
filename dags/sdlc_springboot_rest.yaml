dag_id: sdlc_springboot_rest
schedule: ""
start_date: "2026-09-01"
catchup: false
max_active_runs: 1
default_retries: 1

tasks:
  - id: springboot_validate_config
    type: powershell
    timeout: 120
    command: "& .\\internal\\scripts\\springboot-validate-config.ps1 -Config configs\\sdlc-springboot.yaml -Artifacts artifacts\\springboot"

  - id: springboot_validate_openapi
    type: powershell
    timeout: 180
    deps: [springboot_validate_config]
    command: "& .\\internal\\scripts\\springboot-validate-openapi.ps1 -Config configs\\sdlc-springboot.yaml -Artifacts artifacts\\springboot"

  - id: springboot_scaffold_from_config
    type: powershell
    timeout: 600
    deps: [springboot_validate_openapi]
    command: "& .\\internal\\scripts\\springboot-scaffold-from-config.ps1 -Config configs\\sdlc-springboot.yaml -Workspace .workspaces\\springboot -Artifacts artifacts\\springboot"

  - id: springboot_maven_compile_from_config
    type: powershell
    timeout: 900
    deps: [springboot_scaffold_from_config]
    command: "& .\\internal\\scripts\\springboot-maven-compile-from-config.ps1 -Config configs\\sdlc-springboot.yaml -Workspace .workspaces\\springboot -Artifacts artifacts\\springboot"

  - id: springboot_maven_test_from_config
    type: powershell
    timeout: 900
    deps: [springboot_maven_compile_from_config]
    command: "& .\\internal\\scripts\\springboot-maven-test-from-config.ps1 -Config configs\\sdlc-springboot.yaml -Workspace .workspaces\\springboot -Artifacts artifacts\\springboot"

  - id: springboot_package_from_config
    type: powershell
    timeout: 600
    deps: [springboot_maven_test_from_config]
    command: "& .\\internal\\scripts\\springboot-package-from-config.ps1 -Config configs\\sdlc-springboot.yaml -Workspace .workspaces\\springboot -Artifacts artifacts\\springboot"
