dag_id: sdlc_springboot_rest
schedule: ""
start_date: "2026-09-01"
catchup: false
max_active_runs: 1
default_retries: 1

tasks:
  - id: validate_config
    type: shell
    timeout: 120
    command: bash scripts/sdlc/springboot/validate.sh --config configs/sdlc-springboot.yaml

  - id: validate_openapi
    type: shell
    timeout: 180
    deps: [validate_config]
    command: bash scripts/sdlc/integration/validate.sh --config configs/sdlc-fullstack.yaml

  - id: scaffold
    type: shell
    timeout: 600
    deps: [validate_openapi]
    command: bash scripts/sdlc/springboot/scaffold.sh --config configs/sdlc-springboot.yaml --workspace /c/Users/Andrzej/Downloads/sdlc/cronova/.workspaces/springboot --artifacts /c/Users/Andrzej/Downloads/sdlc/cronova/artifacts/springboot

  - id: compile
    type: shell
    timeout: 900
    deps: [scaffold]
    command: bash scripts/sdlc/springboot/compile.sh --config configs/sdlc-springboot.yaml --workspace /c/Users/Andrzej/Downloads/sdlc/cronova/.workspaces/springboot --artifacts /c/Users/Andrzej/Downloads/sdlc/cronova/artifacts/springboot

  - id: unit_tests
    type: shell
    timeout: 900
    deps: [compile]
    command: bash scripts/sdlc/springboot/unit-test.sh --config configs/sdlc-springboot.yaml --workspace /c/Users/Andrzej/Downloads/sdlc/cronova/.workspaces/springboot --artifacts /c/Users/Andrzej/Downloads/sdlc/cronova/artifacts/springboot

  - id: package
    type: shell
    timeout: 600
    deps: [unit_tests]
    command: bash scripts/sdlc/springboot/package.sh --config configs/sdlc-springboot.yaml --workspace /c/Users/Andrzej/Downloads/sdlc/cronova/.workspaces/springboot --artifacts /c/Users/Andrzej/Downloads/sdlc/cronova/artifacts/springboot
