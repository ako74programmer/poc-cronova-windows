dag_id: sdlc_springboot_startio
schedule: "0 2 * * *"        # nightly build; remove for manual-only
start_date: "2026-09-01"
catchup: false
max_active_runs: 1
default_retries: 0

# Composable Spring Initializr pipeline:
# scaffold -> compile -> add CRUD -> review/fix loop -> tests.
tasks:
  - id: scaffold
    type: powershell
    timeout: 300
    command: "& .\\internal\\scripts\\fetch-springboot-project.ps1 -t maven-project -l java -b 4.0.8 -g com.example -a demo -n com.example.demo -Packaging jar -c properties -j 21 -d web -w workspaces/springboot-startio -Project app -Clean"

  - id: compile_skeleton
    type: powershell
    timeout: 600
    deps: [scaffold]
    command: "& .\\internal\\scripts\\compile-project.ps1 -w workspaces/springboot-startio -p app"

  - id: ai_add_crud
    type: powershell
    timeout: 300
    deps: [compile_skeleton]
    command: "& .\\internal\\scripts\\ai-generate-crud.ps1 -w workspaces/springboot-startio -p app -k com.example.demo -r default -y python"

  - id: compile_loop
    type: powershell
    timeout: 900
    deps: [ai_add_crud]
    command: "& .\\internal\\scripts\\ai-review-fix-loop.ps1 -w workspaces/springboot-startio -p app -k com.example.demo -r default -y python"

  - id: tests
    type: powershell
    timeout: 300
    deps: [compile_loop]
    command: "& .\\internal\\scripts\\run-tests.ps1 -w workspaces/springboot-startio -p app"
