dag_id: sdlc_angular
start_date: "2026-09-01"
catchup: false
max_active_runs: 1
default_retries: 1
tasks:
    - id: angular_validate_config
      type: powershell
      command: '& .\internal\scripts\angular-validate-config.ps1 -Config configs\sdlc-angular.yaml -Workspace .workspaces\angular -Artifacts artifacts\angular'
    - id: angular_scaffold_from_config
      type: powershell
      command: '& .\internal\scripts\angular-scaffold-from-config.ps1 -Config configs\sdlc-angular.yaml -Workspace .workspaces\angular -Artifacts artifacts\angular'
      deps:
        - angular_validate_config
    - id: angular_npm_install_from_config
      type: powershell
      command: '& .\internal\scripts\angular-npm-install-from-config.ps1 -Config configs\sdlc-angular.yaml -Workspace .workspaces\angular -Artifacts artifacts\angular'
      deps:
        - angular_scaffold_from_config
    - id: angular_lint_from_config
      type: powershell
      command: '& .\internal\scripts\angular-lint-from-config.ps1 -Config configs\sdlc-angular.yaml -Workspace .workspaces\angular -Artifacts artifacts\angular'
      deps:
        - angular_npm_install_from_config
    - id: angular_test_from_config
      type: powershell
      command: '& .\internal\scripts\angular-test-from-config.ps1 -Config configs\sdlc-angular.yaml -Workspace .workspaces\angular -Artifacts artifacts\angular'
      deps:
        - angular_lint_from_config
    - id: angular_build_from_config
      type: powershell
      command: '& .\internal\scripts\angular-build-from-config.ps1 -Config configs\sdlc-angular.yaml -Workspace .workspaces\angular -Artifacts artifacts\angular'
      deps:
        - angular_test_from_config
    - id: angular_smoke_test_from_config
      type: powershell
      command: '& .\internal\scripts\angular-smoke-test-from-config.ps1 -Config configs\sdlc-angular.yaml -Workspace .workspaces\angular -Artifacts artifacts\angular'
      deps:
        - angular_build_from_config
