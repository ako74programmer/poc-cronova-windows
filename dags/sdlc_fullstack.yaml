dag_id: sdlc_fullstack
schedule: ""
start_date: "2026-09-01"
catchup: false
max_active_runs: 1
default_retries: 1

tasks:
  - id: validate_stack
    type: shell
    timeout: 180
    command: bash scripts/sdlc/integration/validate.sh --config configs/sdlc-fullstack.yaml

  - id: validate_frontend_config
    type: shell
    timeout: 180
    command: bash scripts/sdlc/angular/validate.sh --config configs/sdlc-angular.yaml

  - id: validate_backend_config
    type: shell
    timeout: 180
    command: bash scripts/sdlc/springboot/validate.sh --config configs/sdlc-springboot.yaml

  - id: scaffold_frontend
    type: shell
    timeout: 900
    deps: [validate_stack, validate_frontend_config]
    command: bash scripts/sdlc/angular/scaffold.sh --config configs/sdlc-angular.yaml

  - id: scaffold_backend
    type: shell
    timeout: 600
    deps: [validate_stack, validate_backend_config]
    command: bash scripts/sdlc/springboot/scaffold.sh --config configs/sdlc-springboot.yaml

  - id: install_frontend_dependencies
    type: shell
    timeout: 1200
    deps: [scaffold_frontend]
    command: bash scripts/sdlc/angular/install.sh --config configs/sdlc-angular.yaml

  - id: lint_frontend
    type: shell
    timeout: 600
    deps: [install_frontend_dependencies]
    command: bash scripts/sdlc/angular/lint.sh --config configs/sdlc-angular.yaml

  - id: test_frontend
    type: shell
    timeout: 900
    deps: [lint_frontend]
    command: bash scripts/sdlc/angular/test.sh --config configs/sdlc-angular.yaml

  - id: build_frontend
    type: shell
    timeout: 900
    deps: [test_frontend]
    command: bash scripts/sdlc/angular/build.sh --config configs/sdlc-angular.yaml

  - id: smoke_test_frontend
    type: shell
    timeout: 300
    deps: [build_frontend]
    command: bash scripts/sdlc/angular/smoke.sh --config configs/sdlc-angular.yaml

  - id: compile_backend
    type: shell
    timeout: 900
    deps: [scaffold_backend]
    command: bash scripts/sdlc/springboot/compile.sh --config configs/sdlc-springboot.yaml

  - id: test_backend
    type: shell
    timeout: 900
    deps: [compile_backend]
    command: bash scripts/sdlc/springboot/unit-test.sh --config configs/sdlc-springboot.yaml

  - id: package_backend
    type: shell
    timeout: 900
    deps: [test_backend]
    command: bash scripts/sdlc/springboot/package.sh --config configs/sdlc-springboot.yaml

  - id: install_playwright
    type: shell
    timeout: 1200
    deps: [validate_stack]
    command: bash scripts/sdlc/playwright/install.sh --config configs/sdlc-fullstack.yaml

  - id: playwright_e2e
    type: shell
    timeout: 2100
    deps: [package_backend, smoke_test_frontend, install_playwright]
    command: bash scripts/sdlc/integration/run-stack-e2e.sh --config configs/sdlc-fullstack.yaml

  - id: collect_logs
    type: shell
    timeout: 180
    deps: [playwright_e2e]
    trigger_rule: all_done
    command: bash scripts/sdlc/integration/collect-logs.sh --config configs/sdlc-fullstack.yaml

  - id: archive_results
    type: shell
    timeout: 300
    deps: [collect_logs]
    trigger_rule: all_done
    command: bash scripts/sdlc/common/archive.sh --config configs/sdlc-fullstack.yaml
