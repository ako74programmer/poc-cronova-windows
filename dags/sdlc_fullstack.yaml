dag_id: sdlc_fullstack
start_date: "2026-09-01"
catchup: false
max_active_runs: 1
default_retries: 1
tasks:
    - id: validate_stack
      type: powershell
      command: '& .\internal\scripts\fullstack-validate-config.ps1 -Config configs\sdlc-fullstack.yaml -Artifacts artifacts\fullstack'
    - id: install_playwright
      type: powershell
      command: '& .\internal\scripts\fullstack-install-playwright.ps1 -Config configs\sdlc-fullstack.yaml -Artifacts artifacts\fullstack'
      deps:
        - validate_stack
    - id: playwright_e2e
      type: powershell
      command: '& .\internal\scripts\fullstack-run-stack-e2e.ps1 -Config configs\sdlc-fullstack.yaml -Artifacts artifacts\fullstack'
      deps:
        - validate_stack
        - install_playwright
    - id: collect_logs
      type: powershell
      command: '& .\internal\scripts\fullstack-collect-logs.ps1 -Config configs\sdlc-fullstack.yaml -Artifacts artifacts\fullstack'
      deps:
        - playwright_e2e
    - id: archive_results
      type: powershell
      command: '& .\internal\scripts\fullstack-archive-results.ps1 -Config configs\sdlc-fullstack.yaml -Artifacts artifacts\fullstack'
      deps:
        - collect_logs
trigger_after:
    - dag_id: sdlc_angular
    - dag_id: sdlc_springboot_rest
